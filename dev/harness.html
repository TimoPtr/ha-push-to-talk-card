<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Push-to-talk feature harness</title>
    <style>
      /* Home Assistant's default theme values the feature relies on. */
      :root {
        --primary-color: #009ac7;
        --primary-text-color: #141414;
        --secondary-text-color: #5e5e5e;
        --text-primary-color: #ffffff;
        --disabled-color: #bdbdbd;
        --disabled-text-color: #bdbdbd;
        --state-inactive-color: #9e9e9e;
        --red-color: #f44336;
        --card-background-color: #ffffff;
        --divider-color: rgba(0, 0, 0, 0.12);
        --page-background: #f3f4f6;
      }
      :root[data-theme="dark"] {
        --primary-color: #009ac7;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --text-primary-color: #ffffff;
        --disabled-color: #464646;
        --disabled-text-color: #6f6f6f;
        --state-inactive-color: #6f6f6f;
        --card-background-color: #1c1c1c;
        --divider-color: rgba(225, 225, 225, 0.12);
        --page-background: #111111;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--page-background);
        color: var(--primary-text-color);
        font-family: Roboto, system-ui, sans-serif;
        font-size: 14px;
      }
      /* A stand-in for the tile card: header, then the feature row. */
      .tile {
        width: var(--tile-width, 250px);
        box-sizing: border-box;
        background: var(--card-background-color);
        border: 1px solid var(--divider-color);
        border-radius: 12px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        min-height: 56px;
      }
      .icon {
        width: 36px;
        height: 36px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        color: var(--state-inactive-color);
        background: color-mix(
          in srgb,
          var(--state-inactive-color) 20%,
          transparent
        );
      }
      .name {
        font-weight: 500;
        line-height: 20px;
      }
      .state {
        font-size: 12px;
        line-height: 16px;
      }
      .features {
        padding: 0 12px 12px;
        --feature-color: var(--state-inactive-color);
        --feature-height: 42px;
        --feature-border-radius: 12px;
        --feature-button-spacing: 12px;
      }
      /* The tile alone, centred in a 290 by 190 window, for README screenshots. */
      :root[data-clean] body {
        padding: 40px 20px;
      }
      :root[data-clean] #result,
      :root[data-clean] #toast {
        display: none;
      }
      #result,
      #toast {
        margin-top: 12px;
        font-size: 12px;
        color: var(--secondary-text-color);
      }
      #toast:not(:empty) {
        padding: 8px 12px;
        border-radius: 8px;
        color: #fff;
        background: #323232;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="header">
        <div class="icon">
          <ha-svg-icon id="tile-icon"></ha-svg-icon>
        </div>
        <div>
          <div class="name">Front door</div>
          <div class="state" id="tile-state">Idle</div>
        </div>
      </div>
      <div class="features" id="features"></div>
    </div>
    <div id="result"></div>
    <div id="toast"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
