---
name: Release

on:  # yamllint disable-line rule:truthy
  release:
    types: [published]

# One run per release; a run that started is left to finish its upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  attach-bundle:
    name: Attach the built file
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload the built file to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
          # No cache: a release must not be built from restored files.
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      # HACS installs dashboard resources from the release assets.
      - name: Attach the built file to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/ha-push-to-talk-card.js --clobber
